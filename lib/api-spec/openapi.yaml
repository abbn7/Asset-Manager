openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: White-label e-commerce store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: store
  - name: products
  - name: collections
  - name: cart
  - name: orders
  - name: customers
  - name: discounts
  - name: reviews
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /store/settings:
    get:
      operationId: getStoreSettings
      tags: [store]
      summary: Get store branding & settings
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
    put:
      operationId: updateStoreSettings
      tags: [admin, store]
      summary: Update store branding & settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStoreSettingsBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }

  /store/announcement:
    get:
      operationId: getAnnouncement
      tags: [store]
      summary: Get the current announcement bar message
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with filters
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: collection
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular, name_asc]
        - in: query
          name: limit
          schema: { type: integer, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
    post:
      operationId: createProduct
      tags: [admin, products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: List featured/highlighted products for the homepage
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 8 }
      responses:
        "200":
          description: Featured
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /products/new-arrivals:
    get:
      operationId: listNewArrivals
      tags: [products]
      summary: Recently added products
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 8 }
      responses:
        "200":
          description: New arrivals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /products/best-sellers:
    get:
      operationId: listBestSellers
      tags: [products]
      summary: Best selling products
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 8 }
      responses:
        "200":
          description: Best sellers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /products/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Get a product by its slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          description: Not found

  /products/{slug}/related:
    get:
      operationId: listRelatedProducts
      tags: [products]
      summary: Get related products for a given product
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 4 }
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /products/id/{id}:
    get:
      operationId: getProductById
      tags: [admin, products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
    put:
      operationId: updateProduct
      tags: [admin, products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [admin, products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
    post:
      operationId: createCollection
      tags: [admin, collections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCollectionBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }

  /collections/{slug}:
    get:
      operationId: getCollectionBySlug
      tags: [collections]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection with products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionDetail" }

  /collections/id/{id}:
    put:
      operationId: updateCollection
      tags: [admin, collections]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCollectionBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
    delete:
      operationId: deleteCollection
      tags: [admin, collections]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current cart (by client cart token)
      parameters:
        - in: query
          name: token
          schema: { type: string }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    post:
      operationId: addToCart
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddToCartBody" }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCartItemBody" }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      operationId: removeCartItem
      tags: [cart]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/apply-discount:
    post:
      operationId: applyDiscountToCart
      tags: [cart, discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyDiscountBody" }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /checkout:
    post:
      operationId: checkout
      tags: [orders]
      summary: Place an order from a cart (mock payment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutBody" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders:
    get:
      operationId: listOrders
      tags: [orders, admin]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, paid, fulfilled, cancelled, refunded]
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }

  /orders/{id}:
    get:
      operationId: getOrderById
      tags: [orders]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
    patch:
      operationId: updateOrderStatus
      tags: [orders, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusBody" }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /customers:
    get:
      operationId: listCustomers
      tags: [admin, customers]
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }

  /discounts:
    get:
      operationId: listDiscounts
      tags: [admin, discounts]
      responses:
        "200":
          description: Discounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Discount" }
    post:
      operationId: createDiscount
      tags: [admin, discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiscountBody" }
      responses:
        "201":
          description: Discount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discount" }

  /discounts/{id}:
    delete:
      operationId: deleteDiscount
      tags: [admin, discounts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /discounts/validate:
    post:
      operationId: validateDiscountCode
      tags: [discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateDiscountBody" }
      responses:
        "200":
          description: Validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountValidation" }

  /reviews:
    get:
      operationId: listReviewsForProduct
      tags: [reviews]
      parameters:
        - in: query
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
    post:
      operationId: createReview
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReviewBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }

  /search:
    get:
      operationId: searchCatalog
      tags: [products]
      summary: Quick search across products and collections
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }

  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [store]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscribeNewsletterBody" }
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Dashboard metrics & summaries
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /admin/analytics/revenue:
    get:
      operationId: getRevenueAnalytics
      tags: [admin]
      parameters:
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 30d, 90d, 12m]
            default: 30d
      responses:
        "200":
          description: Revenue series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueAnalytics" }

  /admin/analytics/top-products:
    get:
      operationId: getTopProducts
      tags: [admin]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Top products by revenue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopProduct" }

  /admin/activity:
    get:
      operationId: getRecentAdminActivity
      tags: [admin]
      summary: Recent activity feed (orders, products, customers)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    StoreSettings:
      type: object
      required: [id, name, tagline, currency, primaryColor, accentColor, logoUrl, heroTitle, heroSubtitle, heroImageUrl, contactEmail, instagramUrl, twitterUrl, footerText]
      properties:
        id: { type: string }
        name: { type: string }
        tagline: { type: string }
        currency: { type: string }
        primaryColor: { type: string }
        accentColor: { type: string }
        logoUrl: { type: string }
        heroTitle: { type: string }
        heroSubtitle: { type: string }
        heroImageUrl: { type: string }
        contactEmail: { type: string }
        instagramUrl: { type: string }
        twitterUrl: { type: string }
        footerText: { type: string }

    UpdateStoreSettingsBody:
      type: object
      properties:
        name: { type: string }
        tagline: { type: string }
        currency: { type: string }
        primaryColor: { type: string }
        accentColor: { type: string }
        logoUrl: { type: string }
        heroTitle: { type: string }
        heroSubtitle: { type: string }
        heroImageUrl: { type: string }
        contactEmail: { type: string }
        instagramUrl: { type: string }
        twitterUrl: { type: string }
        footerText: { type: string }

    Announcement:
      type: object
      required: [message, enabled]
      properties:
        message: { type: string }
        enabled: { type: boolean }

    Product:
      type: object
      required: [id, slug, name, description, price, compareAtPrice, currency, images, tags, inStock, featured, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        compareAtPrice:
          oneOf:
            - { type: number }
            - { type: "null" }
        currency: { type: string }
        images:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        inStock: { type: boolean }
        featured: { type: boolean }
        createdAt: { type: string }
        rating:
          oneOf:
            - { type: number }
            - { type: "null" }
        reviewCount: { type: integer }

    ProductVariant:
      type: object
      required: [id, name, value, price, inStock]
      properties:
        id: { type: string }
        name: { type: string }
        value: { type: string }
        price: { type: number }
        inStock: { type: boolean }

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [variants, collections, fullDescription]
          properties:
            fullDescription: { type: string }
            variants:
              type: array
              items: { $ref: "#/components/schemas/ProductVariant" }
            collections:
              type: array
              items: { $ref: "#/components/schemas/Collection" }

    ProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total: { type: integer }

    CreateProductBody:
      type: object
      required: [name, description, price, currency]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        fullDescription: { type: string }
        price: { type: number }
        compareAtPrice: { type: number }
        currency: { type: string }
        images:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        inStock: { type: boolean }
        featured: { type: boolean }
        collectionIds:
          type: array
          items: { type: string }

    UpdateProductBody:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        fullDescription: { type: string }
        price: { type: number }
        compareAtPrice: { type: number }
        currency: { type: string }
        images:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        inStock: { type: boolean }
        featured: { type: boolean }
        collectionIds:
          type: array
          items: { type: string }

    Collection:
      type: object
      required: [id, slug, name, description, imageUrl, productCount]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        productCount: { type: integer }

    CollectionDetail:
      allOf:
        - $ref: "#/components/schemas/Collection"
        - type: object
          required: [products]
          properties:
            products:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    CreateCollectionBody:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        imageUrl: { type: string }

    UpdateCollectionBody:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        imageUrl: { type: string }

    CartItem:
      type: object
      required: [id, productId, productName, productImage, productSlug, variantName, unitPrice, quantity, lineTotal]
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        productImage: { type: string }
        productSlug: { type: string }
        variantName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }

    Cart:
      type: object
      required: [token, items, subtotal, discount, shipping, tax, total, currency, itemCount]
      properties:
        token: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotal: { type: number }
        discount: { type: number }
        shipping: { type: number }
        tax: { type: number }
        total: { type: number }
        currency: { type: string }
        itemCount: { type: integer }
        appliedDiscountCode:
          oneOf:
            - { type: string }
            - { type: "null" }

    AddToCartBody:
      type: object
      required: [productId, quantity]
      properties:
        token: { type: string }
        productId: { type: string }
        variantName: { type: string }
        quantity: { type: integer, minimum: 1 }

    UpdateCartItemBody:
      type: object
      required: [token, quantity]
      properties:
        token: { type: string }
        quantity: { type: integer, minimum: 0 }

    ApplyDiscountBody:
      type: object
      required: [token, code]
      properties:
        token: { type: string }
        code: { type: string }

    CheckoutBody:
      type: object
      required: [token, email, shippingAddress]
      properties:
        token: { type: string }
        email: { type: string }
        shippingAddress: { $ref: "#/components/schemas/Address" }

    Address:
      type: object
      required: [fullName, line1, city, postalCode, country]
      properties:
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
        phone: { type: string }

    OrderItem:
      type: object
      required: [id, productName, productImage, variantName, unitPrice, quantity, lineTotal]
      properties:
        id: { type: string }
        productName: { type: string }
        productImage: { type: string }
        variantName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }

    Order:
      type: object
      required: [id, orderNumber, status, email, items, subtotal, discount, shipping, tax, total, currency, shippingAddress, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status:
          type: string
          enum: [pending, paid, fulfilled, cancelled, refunded]
        email: { type: string }
        customerName: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal: { type: number }
        discount: { type: number }
        shipping: { type: number }
        tax: { type: number }
        total: { type: number }
        currency: { type: string }
        shippingAddress: { $ref: "#/components/schemas/Address" }
        createdAt: { type: string }

    OrderList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        total: { type: integer }

    UpdateOrderStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paid, fulfilled, cancelled, refunded]

    Customer:
      type: object
      required: [email, orderCount, totalSpent, currency, lastOrderAt]
      properties:
        email: { type: string }
        name: { type: string }
        orderCount: { type: integer }
        totalSpent: { type: number }
        currency: { type: string }
        lastOrderAt: { type: string }

    Discount:
      type: object
      required: [id, code, type, value, active, usageCount, createdAt]
      properties:
        id: { type: string }
        code: { type: string }
        type:
          type: string
          enum: [percentage, fixed]
        value: { type: number }
        minSubtotal:
          oneOf:
            - { type: number }
            - { type: "null" }
        active: { type: boolean }
        usageCount: { type: integer }
        usageLimit:
          oneOf:
            - { type: integer }
            - { type: "null" }
        expiresAt:
          oneOf:
            - { type: string }
            - { type: "null" }
        createdAt: { type: string }

    CreateDiscountBody:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string }
        type:
          type: string
          enum: [percentage, fixed]
        value: { type: number }
        minSubtotal: { type: number }
        usageLimit: { type: integer }
        expiresAt: { type: string }

    ValidateDiscountBody:
      type: object
      required: [code, subtotal]
      properties:
        code: { type: string }
        subtotal: { type: number }

    DiscountValidation:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        message: { type: string }
        discountAmount: { type: number }
        code: { type: string }

    Review:
      type: object
      required: [id, productId, authorName, rating, title, body, createdAt]
      properties:
        id: { type: string }
        productId: { type: string }
        authorName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string }

    CreateReviewBody:
      type: object
      required: [productId, authorName, rating, title, body]
      properties:
        productId: { type: string }
        authorName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }

    SearchResults:
      type: object
      required: [products, collections]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }

    SubscribeNewsletterBody:
      type: object
      required: [email]
      properties:
        email: { type: string }

    DashboardSummary:
      type: object
      required: [totalRevenue, totalOrders, totalCustomers, totalProducts, currency, revenueChangePct, ordersChangePct, recentOrders, lowStockCount]
      properties:
        totalRevenue: { type: number }
        totalOrders: { type: integer }
        totalCustomers: { type: integer }
        totalProducts: { type: integer }
        currency: { type: string }
        revenueChangePct: { type: number }
        ordersChangePct: { type: number }
        lowStockCount: { type: integer }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }

    RevenuePoint:
      type: object
      required: [date, revenue, orders]
      properties:
        date: { type: string }
        revenue: { type: number }
        orders: { type: integer }

    RevenueAnalytics:
      type: object
      required: [points, totalRevenue, totalOrders, currency]
      properties:
        points:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        totalRevenue: { type: number }
        totalOrders: { type: integer }
        currency: { type: string }

    TopProduct:
      type: object
      required: [productId, name, image, unitsSold, revenue, currency]
      properties:
        productId: { type: string }
        name: { type: string }
        image: { type: string }
        unitsSold: { type: integer }
        revenue: { type: number }
        currency: { type: string }

    ActivityEvent:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [order, product, customer, review]
        message: { type: string }
        createdAt: { type: string }
